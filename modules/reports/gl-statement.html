<!-- UniTax · General Ledger Statement (FBL5N-style) — inputs & granular search only. Execution opens the routed UniTax List Viewer. -->
<style>
    .gl-exec-status { display:none; align-items:center; gap:8px; font-size:10px; font-weight:700; letter-spacing:.05em; color:#b45309; background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:4px 10px; text-transform:uppercase; }
    .gl-exec-status.is-on { display:inline-flex; }
    .gl-layout-box { border:1px solid #e2e8f0; border-radius:8px; background:#fbfcfe; padding:8px 12px; }
    .gl-layout-grid { display:flex; flex-wrap:wrap; gap:6px 14px; }
    .gl-layout-item { display:flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:#334155; white-space:nowrap; cursor:pointer; user-select:none; padding:2px 4px; border-radius:4px; }
    .gl-layout-item:hover { background:#eef4ff; color:#1d4ed8; }
    .gl-layout-item input { cursor:pointer; accent-color:#0052ea; }
    .gl-field-disabled { opacity:.55; pointer-events:none; }
</style>

<div class="animate-in gl-statement-wrapper">
    <div class="card border-0 shadow-sm main-card-wrapper">
        <div class="card-body p-0">
            <div class="screen-only">
                <!-- Toolbar -->
                <div class="d-flex justify-content-between align-items-center p-3 border-bottom bg-light no-print" id="glToolbar">
                    <div>
                        <h5 class="fw-bold mb-0"><i class="bi bi-journal-text me-2 text-primary"></i>General Ledger Statement</h5>
                        <p class="text-muted small mb-0">SAP-style line item report (FBL5N) — includes granular field-by-field search</p>
                    </div>
                    <div class="d-flex gap-2 align-items-center">
                        <span class="gl-exec-status" id="glExecStatus"><span class="spinner-border spinner-border-sm" style="width:11px;height:11px;border-width:2px;"></span>Executing Statement</span>
                        <button type="button" id="glResetBtn" title="Clear all filters" class="btn btn-erp-icon"><i class="bi bi-x-lg"></i></button>
                        <button type="button" id="glExportBtn" title="Export to CSV" class="btn btn-erp-icon"><i class="bi bi-file-earmark-spreadsheet"></i></button>
                        <button type="button" id="glPrintBtn" title="Print Account Statement" class="btn btn-erp-icon"><i class="bi bi-printer"></i></button>
                        <button type="button" id="glExecuteBtn" title="Execute / View Statement" class="btn btn-erp-icon btn-erp-icon-primary"><i class="bi bi-check2 me-1"></i></button>
                    </div>
                </div>

                <div class="p-4 no-print" id="glFilterFormWrapper">
                    <form id="glFilterForm" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Company Code / Entity</label>
                            <input type="text" id="targetCompany" name="companySearch" class="form-control form-control-sm"
                                   list="glCompanyList" placeholder="All Companies / Primary"
                                   data-fetch_column data-sheet_name="Companies" data-column_name="companyName&CompanyCode">
                            <datalist id="glCompanyList"></datalist>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Select Ledger Account <span class="text-danger">*</span></label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
                                <input type="text" id="targetAccount" name="ledgerSearch" class="form-control"
                                       list="ledgerList" placeholder="Search Ledger Name..." required
                                       data-fetch_column data-sheet_name="LedgerCreation" data-column_name="name&ledgerCode">
                            </div>
                            <datalist id="ledgerList"></datalist>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold posting-date-label"><i class="bi bi-calendar-event me-1"></i>Posting From</label>
                            <input type="date" id="fromDate" class="form-control form-control-sm posting-date-field">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold posting-date-label"><i class="bi bi-calendar-check me-1"></i>Posting To</label>
                            <input type="date" id="toDate" class="form-control form-control-sm posting-date-field">
                        </div>

                        <!-- Granular Search Mode Switch -->
                        <div class="col-12 mt-2">
                            <div class="d-flex justify-content-between align-items-center py-2 px-3 bg-light rounded-2 border">
                                <div class="form-check form-switch mb-0">
                                    <input class="form-check-input" type="checkbox" id="glGranularToggle" onchange="window.toggleGlGranularSearch(this.checked)">
                                    <label class="form-check-label fw-bold small text-dark" for="glGranularToggle">
                                        <i class="bi bi-sliders2 me-1 text-primary"></i> Granular Field-by-Field Search (Option Enabled)
                                    </label>
                                </div>
                                <span class="badge bg-white text-muted border small" id="glFilterModeBadge">
                                    Primary Filter Mode (Extract All by Posting Date, GL, Company)
                                </span>
                            </div>
                        </div>

                        <!-- Granular Search Panel (Collapsible) -->
                        <div id="glGranularPanel" class="col-12 p-3 bg-white border rounded-2 shadow-sm" style="display:none;">
                            <div class="row g-3">
                                <div class="col-md-2">
                                    <label class="form-label small fw-bold">Doc No From</label>
                                    <input type="text" id="glSearchDocNoFrom" class="form-control form-control-sm" placeholder="e.g. SL-0001" autocomplete="off">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-bold">Doc No To</label>
                                    <input type="text" id="glSearchDocNoTo" class="form-control form-control-sm" placeholder="e.g. SL-9999" autocomplete="off">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label small fw-bold">Doc No Contains</label>
                                    <input type="text" id="glSearchDocNo" class="form-control form-control-sm" placeholder="keyword...">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Doc Date From</label>
                                    <input type="date" id="glSearchDocDateFrom" class="form-control form-control-sm">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Doc Date To</label>
                                    <input type="date" id="glSearchDocDateTo" class="form-control form-control-sm">
                                </div>

                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Entity / Counterparty</label>
                                    <input type="text" id="glSearchEntity" class="form-control form-control-sm" placeholder="Customer or Supplier...">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Project / Cost Center</label>
                                    <input type="text" id="glSearchProject" class="form-control form-control-sm" placeholder="General, Project A...">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Document Type</label>
                                    <select id="glSearchDocType" class="form-select form-select-sm">
                                        <option value="" selected>All Document Types</option>
                                        <option value="SALE">Sales Invoices</option>
                                        <option value="PURCHASE">Purchase Bills</option>
                                        <option value="PAYMENT">Payment Vouchers</option>
                                        <option value="RECEIPT">Receipt Vouchers</option>
                                        <option value="CREDITNOTE">Credit Notes</option>
                                        <option value="DEBITNOTE">Debit Notes</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label small fw-bold">Direction</label>
                                    <select id="glSearchDrCr" class="form-select form-select-sm">
                                        <option value="" selected>Debit &amp; Credit</option>
                                        <option value="DR">Debit Only</option>
                                        <option value="CR">Credit Only</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Narration / Memo Keyword</label>
                                    <input type="text" id="glSearchNarration" class="form-control form-control-sm" placeholder="Search narration or line remarks...">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Min Amount (₹)</label>
                                    <input type="number" id="glSearchMinAmount" class="form-control form-control-sm" placeholder="0.00" step="any">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold">Max Amount (₹)</label>
                                    <input type="number" id="glSearchMaxAmount" class="form-control form-control-sm" placeholder="No limit" step="any">
                                </div>
                            </div>
                        </div>

                        <!-- User-Customizable Report Layout (columns shown in the List Viewer) -->
                        <div class="col-12">
                            <div class="gl-layout-box">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <label class="form-label small fw-bold mb-0"><i class="bi bi-layout-sidebar-inset me-1 text-primary"></i>Report Layout — Columns to Show (User Customized)</label>
                                    <span>
                                        <button type="button" class="btn btn-link btn-sm p-0 me-2 text-decoration-none small fw-bold" id="glLayoutAll">Select All</button>
                                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none small fw-bold" id="glLayoutDefault">Default</button>
                                    </span>
                                </div>
                                <div class="gl-layout-grid" id="glLayoutBoxes"></div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const COLUMN_DEFS = [
        { id: 'postingDate', label: 'Date' },
        { id: 'docDate',     label: 'Doc Date' },
        { id: 'docType',     label: 'Doc Type' },
        { id: 'refNo',       label: 'Ref No' },
        { id: 'entity',      label: 'Entity' },
        { id: 'narration',   label: 'Narration' },
        { id: 'dr',          label: 'Debit' },
        { id: 'cr',          label: 'Credit' },
        { id: 'balance',     label: 'Balance' }
    ];
    const DEFAULT_COLS = ['postingDate', 'docType', 'entity', 'refNo', 'dr', 'cr', 'balance'];
    const COLS_KEY = 'gl.statement.columns';

    const getSavedCols = () => {
        try {
            const raw = localStorage.getItem(COLS_KEY);
            const arr = raw ? JSON.parse(raw) : null;
            if (Array.isArray(arr) && arr.length) return COLUMN_DEFS.filter(c => arr.includes(c.id)).map(c => c.id);
        } catch (e) {}
        return DEFAULT_COLS.slice();
    };
    const getSelectedCols = () => {
        const boxes = document.querySelectorAll('#glLayoutBoxes input[data-col]');
        const checked = Array.from(boxes).filter(b => b.checked).map(b => b.getAttribute('data-col'));
        if (!checked.length) return DEFAULT_COLS.slice();
        return COLUMN_DEFS.filter(c => checked.includes(c.id)).map(c => c.id);
    };
    const saveCols = (cols) => { try { localStorage.setItem(COLS_KEY, JSON.stringify(cols)); } catch (e) {} };

    // Render layout checkboxes
    try {
        const saved = getSavedCols();
        const wrap = document.getElementById('glLayoutBoxes');
        if (wrap) {
            wrap.innerHTML = COLUMN_DEFS.map(c => `<label class="gl-layout-item"><input type="checkbox" data-col="${c.id}" ${saved.includes(c.id) ? 'checked' : ''}>${c.label}</label>`).join('');
            wrap.addEventListener('change', () => saveCols(getSelectedCols()));
        }
        const allBtn = document.getElementById('glLayoutAll');
        if (allBtn) allBtn.addEventListener('click', () => { document.querySelectorAll('#glLayoutBoxes input[data-col]').forEach(b => { b.checked = true; }); saveCols(getSelectedCols()); });
        const defBtn = document.getElementById('glLayoutDefault');
        if (defBtn) defBtn.addEventListener('click', () => { document.querySelectorAll('#glLayoutBoxes input[data-col]').forEach(b => { b.checked = DEFAULT_COLS.includes(b.getAttribute('data-col')); }); saveCols(getSelectedCols()); });
    } catch (e) {}

    const now = new Date();
    const toDateEl = document.getElementById('toDate');
    if (toDateEl) toDateEl.valueAsDate = now;
    const fyYear = (now.getMonth() >= 3) ? now.getFullYear() : now.getFullYear() - 1;
    const fromDateEl = document.getElementById('fromDate');
    if (fromDateEl) fromDateEl.value = `${fyYear}-04-01`;

    // --- Check URL parameters for ledger drill-down linking ---
    setTimeout(() => {
        try {
            const rawHash = window.location.hash || '';
            const searchPart = rawHash.includes('?') ? rawHash.split('?')[1] : (window.location.search ? window.location.search.substring(1) : '');
            if (searchPart) {
                const params = new URLSearchParams(searchPart);
                const targetL = params.get('ledger') || params.get('account');
                if (targetL) {
                    const decoded = decodeURIComponent(targetL);
                    const acctInput = document.getElementById('targetAccount');
                    if (acctInput) {
                        acctInput.value = decoded;
                        window.generateStatement();
                    }
                }
            }
        } catch (e) {}
    }, 300);

    const getDocPrefix = (formId) => {
        const typeMap = {
            'SalesInvoiceForm': 'Sales',
            'PurchaseInvoiceForm': 'Purchase',
            'SalesReturnForm': 'Credit Note',
            'CreditNoteForm': 'Credit Note',
            'PurchaseReturnForm': 'Debit Note',
            'DebitNoteForm': 'Debit Note',
            'ReceiptVoucherForm': 'Receipt',
            'PaymentVoucherForm': 'Payment',
            'ReceiptPayForm': 'Contra',
            'JournalVoucherForm': 'Journal'
        };
        return typeMap[formId] || String(formId || 'TXN').replace('Form', '').replace(/([A-Z])/g, ' $1').trim();
    };

    // --- Disable / enable every interactive control while executing ---
    const setBusy = (busy) => {
        try {
            document.querySelectorAll('#glFilterFormWrapper input, #glFilterFormWrapper select, #glFilterFormWrapper textarea, #glFilterFormWrapper button, #glToolbar input, #glToolbar select, #glToolbar button')
                .forEach(el => { el.disabled = !!busy; });
            const execBtn = document.getElementById('glExecuteBtn');
            if (execBtn) execBtn.disabled = !!busy;
            const status = document.getElementById('glExecStatus');
            if (status) status.classList.toggle('is-on', !!busy);
            if (typeof App !== 'undefined' && App.UI && App.UI.Notify) {
                if (busy) App.UI.Notify('Executing', 'Compiling ledger statement — please wait…', 'info');
            }
        } catch (e) {}
    };

    window.toggleGlGranularSearch = function(isEnabled) {
        const panel = document.getElementById('glGranularPanel');
        const badge = document.getElementById('glFilterModeBadge');
        if (panel) panel.style.display = isEnabled ? 'block' : 'none';
        if (badge) {
            if (isEnabled) {
                badge.className = "badge bg-primary text-white border-0 small";
                badge.innerText = "Granular Search Active (Field-by-Field Filtering)";
            } else {
                badge.className = "badge bg-white text-muted border small";
                badge.innerText = "Primary Filter Mode (Extract All by Posting Date, GL, Company)";
            }
        }
    };

    const resetFilters = () => {
        document.getElementById('glFilterForm')?.reset();
        const now2 = new Date();
        if (toDateEl) toDateEl.valueAsDate = now2;
        const fy2 = (now2.getMonth() >= 3) ? now2.getFullYear() : now2.getFullYear() - 1;
        if (fromDateEl) fromDateEl.value = `${fy2}-04-01`;
        window.toggleGlGranularSearch(false);
        const tg = document.getElementById('glGranularToggle');
        if (tg) tg.checked = false;
    };

    // Print the last executed statement (explicit args — no DOM scraping).
    window.printStatement = function() {
        const m = window._glLastMeta;
        if (m && m.account && Array.isArray(m.transactions) && m.transactions.length && typeof window.printLedgerStatement === 'function') {
            window.printLedgerStatement(m.account, m.transactions);
        } else if (typeof App !== 'undefined' && App.UI && App.UI.Notify) {
            App.UI.Notify('Print', 'Please execute a statement first.', 'warning');
        }
    };

    // Export the last executed statement to CSV (same column order as selected layout).
    window.exportStatement = function() {
        const m = window._glLastMeta;
        if (!m || !Array.isArray(m.listRows) || !m.listRows.length) {
            if (typeof App !== 'undefined' && App.UI && App.UI.Notify) App.UI.Notify('Export', 'Please execute a statement first.', 'warning');
            return;
        }
        const cols = (m.columns && m.columns.length) ? m.columns : DEFAULT_COLS;
        const HEADERS = { postingDate: 'Date', docDate: 'Doc Date', docType: 'Doc Type', refNo: 'Ref No', entity: 'Entity', narration: 'Narration', dr: 'Debit', cr: 'Credit', balance: 'Balance' };
        const csvEsc = (v) => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const fmtSigned = (v) => {
            const n = Number(v) || 0;
            return `${Math.abs(n).toFixed(2)} ${n >= 0 ? 'Dr' : 'Cr'}`;
        };
        const lines = [cols.map(c => HEADERS[c] || c).join(',')];
        m.listRows.forEach((o) => {
            const cell = {
                postingDate: o.postingDate, docDate: o.docDate, docType: o.docType, refNo: o.refNo,
                entity: o.entity, narration: o.narration, dr: o.dr, cr: o.cr,
                balance: fmtSigned(o.balance)
            };
            lines.push(cols.map(c => csvEsc(cell[c])).join(','));
        });
        try {
            const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ledger-statement-${Date.now()}.csv`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        } catch (e) {}
    };

    // Wire toolbar buttons
    try {
        document.getElementById('glExecuteBtn')?.addEventListener('click', () => window.generateStatement());
        document.getElementById('glPrintBtn')?.addEventListener('click', () => window.printStatement());
        document.getElementById('glExportBtn')?.addEventListener('click', () => window.exportStatement());
        document.getElementById('glResetBtn')?.addEventListener('click', () => resetFilters());
    } catch (e) {}

    window.generateStatement = async function() {
        const accountInput = document.getElementById('targetAccount');
        const account = accountInput ? accountInput.value.trim() : '';
        const fromDate = document.getElementById('fromDate')?.value || '';
        const toDate = document.getElementById('toDate')?.value || '';

        if (!account) {
            if (typeof App !== 'undefined' && App.UI && App.UI.Notify) App.UI.Notify('Validation', 'Please select a ledger account.', 'warning');
            return;
        }

        let ledgerCode = '';
        let ledgerName = account;
        const codeMatch = account.match(/\(([^)]+)\)/);
        if (codeMatch) {
            ledgerCode = codeMatch[1].trim();
            ledgerName = account.replace(`(${codeMatch[1]})`, '').trim();
        } else {
            const sqMatch = account.match(/\[([^\]]+)\]/);
            if (sqMatch) {
                ledgerCode = sqMatch[1].trim();
                ledgerName = account.replace(`[${sqMatch[1]}]`, '').trim();
            }
        }

        setBusy(true);

        let ledgerMap = {};
        let resolvedLedgerCode = ledgerCode;
        let resolvedLedgerName = ledgerName;
        let linkedCompanyCode = null;
        let openingBalance = 0;
        let openingBalanceType = 'Dr';

        // Resolve a raw voucher ledger reference (RTDB key / code / name / "Name (CODE)") to the proper ledger name.
        const resolveLedgerName = (raw) => {
            if (!raw) return '';
            const s = String(raw).trim();
            const low = s.toLowerCase();
            if (ledgerMap[low]) return ledgerMap[low];
            const m = s.match(/^(.*?)\(([^)]+)\)\s*$/);
            if (m) {
                const byCode = ledgerMap[(m[2] || '').trim().toLowerCase()];
                if (byCode) return byCode;
                const byName = ledgerMap[(m[1] || '').trim().toLowerCase()];
                if (byName) return byName;
            }
            const m2 = s.match(/^(.*?)\[([^\]]+)\]\s*$/);
            if (m2) {
                const byCode2 = ledgerMap[(m2[2] || '').trim().toLowerCase()];
                if (byCode2) return byCode2;
                const byName2 = ledgerMap[(m2[1] || '').trim().toLowerCase()];
                if (byName2) return byName2;
            }
            return s;
        };

        try {
            // --- 1. RESOLVE LEDGER & COMPANY & OPENING BALANCE ---
            try {
                const masterData = await API.Fetch('Masters/LedgerCreation');
                if (masterData) {
                    Object.entries(masterData).forEach(([masterKey, ledger]) => {
                        if (!ledger) return;
                        const codeStr = ledger.ledgerCode ? ledger.ledgerCode.toString().trim() : '';
                        const nameStr = ledger.name ? ledger.name.toString().trim() : '';
                        if (codeStr) ledgerMap[codeStr.toLowerCase()] = nameStr;
                        if (nameStr) ledgerMap[nameStr.toLowerCase()] = nameStr;
                        // Vouchers store the master RTDB key (e.g. -P5uf…) as the ledger reference — map it to the proper name too
                        const keyStr = String(masterKey || '').trim();
                        if (keyStr && nameStr) ledgerMap[keyStr.toLowerCase()] = nameStr;
                        const idStr = String(ledger.id || ledger.ID || '').trim();
                        if (idStr && nameStr) ledgerMap[idStr.toLowerCase()] = nameStr;

                        const searchInput = account.toLowerCase();
                        if ((codeStr && codeStr.toLowerCase() === searchInput) ||
                            (nameStr && nameStr.toLowerCase() === searchInput) ||
                            (codeStr && ledgerCode && codeStr.toLowerCase() === ledgerCode.toLowerCase()) ||
                            (nameStr && nameStr.toLowerCase() === ledgerName.toLowerCase()) ||
                            (nameStr && searchInput.includes(nameStr.toLowerCase())) ||
                            (codeStr && searchInput.includes(codeStr.toLowerCase()))) {

                            resolvedLedgerCode = codeStr || resolvedLedgerCode;
                            resolvedLedgerName = nameStr || resolvedLedgerName;
                            linkedCompanyCode = ledger.CompanyName || ledger.CompanyCode;

                            const rawOpeningBal = parseFloat(ledger.openingBalance) ||
                                                 parseFloat(ledger.OpeningBalance) ||
                                                 parseFloat(ledger.openingAmount) || 0;
                            openingBalance = rawOpeningBal;

                            const ledgerNature = (ledger.ledgerNature || ledger.LedgerNature || ledger.nature || ledger.balanceType || '').toLowerCase();
                            if (openingBalance !== 0) {
                                if (ledgerNature.includes('cr') || ledgerNature.includes('credit') || ledgerNature.includes('liability') || ledgerNature.includes('income') || ledgerNature.includes('equity') || ledgerNature.includes('capital')) {
                                    openingBalanceType = 'Cr';
                                } else {
                                    openingBalanceType = 'Dr';
                                }
                            }
                        }
                    });
                }
            } catch (e) {}

            // --- 2. FETCH COMPANY DETAILS (kept on the raw record — not displayed, used by print engine paths) ---
            try {
                const companiesData = await API.Fetch('Masters/Companies');
                if (companiesData) {
                    const compList = Object.values(companiesData);
                    let companyInfo = null;
                    if (linkedCompanyCode) {
                        companyInfo = compList.find(c =>
                            c && (String(c.CompanyCode || '').toLowerCase() === String(linkedCompanyCode).toLowerCase() ||
                            String(c.companyName || '').toLowerCase().includes(String(linkedCompanyCode).toLowerCase()))
                        );
                    }
                    const targetCompInput = document.getElementById('targetCompany')?.value?.trim();
                    if (!companyInfo && targetCompInput) {
                        companyInfo = compList.find(c =>
                            c && (targetCompInput.toLowerCase().includes(String(c.companyName || '').toLowerCase()) ||
                            targetCompInput.toLowerCase().includes(String(c.CompanyCode || '').toLowerCase()))
                        );
                    }
                    if (!companyInfo && compList.length > 0) companyInfo = compList[0];
                    window._glCompanyInfo = companyInfo || null;
                }
            } catch (e) {
                console.warn("Company details fetch warning:", e);
            }

            const isSalesAccountSearch = resolvedLedgerName.toLowerCase().includes('sale');
            const isPurchAccountSearch = resolvedLedgerName.toLowerCase().includes('purchas');
            const isTaxAccountSearch = resolvedLedgerName.toLowerCase().includes('duty') || resolvedLedgerName.toLowerCase().includes('tax') || resolvedLedgerName.toLowerCase().includes('gst');

            // --- 3. FETCH ALL VOUCHERS ACROSS ROOT AND FORMS ---
            let allTransactions = [];
            try {
                const rootTxns = await API.Fetch('Transactions');
                if (rootTxns && typeof rootTxns === 'object') {
                    Object.entries(rootTxns).forEach(([type, formRecords]) => {
                        if (formRecords && typeof formRecords === 'object') {
                            Object.entries(formRecords).forEach(([key, vch]) => {
                                if (!vch || typeof vch !== 'object') return;
                                const isDeleted = vch.is_deleted === true || (vch.header && vch.header.is_deleted === true) || vch.status === 'DELETED' || (vch.header && vch.header.status === 'DELETED');
                                const isDraftOrPending = vch.status === 'DRAFT' || vch.status === 'PENDING_APPROVAL' || (vch.header && (vch.header.status === 'DRAFT' || vch.header.status === 'PENDING_APPROVAL'));
                                if (!isDeleted && !isDraftOrPending) allTransactions.push({ ...vch, key, formId: type });
                            });
                        }
                    });
                }
            } catch (e) {}

            if (allTransactions.length === 0) {
                let types = (window.API && typeof API.GetAllTransactionTypes === 'function')
                    ? await API.GetAllTransactionTypes().catch(() => null)
                    : null;
                if (!types || !Array.isArray(types)) {
                    types = [
                        'SalesInvoiceForm', 'SalesReturnForm', 'CreditNoteForm',
                        'PurchaseInvoiceForm', 'PurchaseReturnForm', 'DebitNoteForm',
                        'PaymentVoucherForm', 'ReceiptVoucherForm', 'ReceiptPayForm', 'JournalVoucherForm'
                    ];
                }
                for (const type of types) {
                    try {
                        const data = await API.Fetch(`Transactions/${type}`);
                        if (data && typeof data === 'object') {
                            Object.entries(data).forEach(([key, vch]) => {
                                if (!vch || typeof vch !== 'object') return;
                                const isDeleted = vch.is_deleted === true || (vch.header && vch.header.is_deleted === true) || vch.status === 'DELETED' || (vch.header && vch.header.status === 'DELETED');
                                const isDraftOrPending = vch.status === 'DRAFT' || vch.status === 'PENDING_APPROVAL' || (vch.header && (vch.header.status === 'DRAFT' || vch.header.status === 'PENDING_APPROVAL'));
                                if (!isDeleted && !isDraftOrPending) allTransactions.push({ ...vch, key, formId: type });
                            });
                        }
                    } catch (e) {}
                }
            }

            allTransactions.sort((a, b) => {
                let timeA = a.header?.posted_at || a.posted_at || new Date(a.header?.posting_date || a.header?.date || a.date || 0).getTime() || 0;
                let timeB = b.header?.posted_at || b.posted_at || new Date(b.header?.posting_date || b.header?.date || b.date || 0).getTime() || 0;
                return timeA - timeB;
            });

            // --- 4. STRICT DOUBLE-ENTRY ACCOUNTING IMPACT EVALUATOR ---
            const targetClean = resolvedLedgerName.toLowerCase().trim();
            const targetCodeClean = resolvedLedgerCode ? resolvedLedgerCode.toLowerCase().trim() : '';

            const isLedgerMatch = (accName) => {
                if (!accName) return false;
                const str = String(accName).toLowerCase().trim();
                if (targetClean && str.includes(targetClean)) return true;
                if (targetCodeClean && str.includes(targetCodeClean)) return true;
                if (isSalesAccountSearch && str.includes('sale')) return true;
                if (isPurchAccountSearch && str.includes('purchas')) return true;
                if (isTaxAccountSearch && (str.includes('tax') || str.includes('duty') || str.includes('gst'))) return true;
                return false;
            };

            const processTransactionImpact = (vch) => {
                const h = vch.header || vch;
                const rawFormId = vch.formId || "JournalVoucher";
                const formLower = rawFormId.toLowerCase();
                const items = Array.isArray(vch.items) ? vch.items : (vch.items ? Object.values(vch.items) : []);

                let dr = 0, cr = 0, displayEntityName = "";

                if (formLower.includes('journal')) {
                    let drLines = [];
                    let crLines = [];
                    items.forEach(it => {
                        if (!it) return;
                        const acct = it.account || it.offset_account || it.ledger || '';
                        const amtDr = parseFloat(it.amount_dr || it.debit || it.dr || 0) || 0;
                        const amtCr = parseFloat(it.amount_cr || it.credit || it.cr || 0) || 0;
                        const lineType = String(it.type || '').toUpperCase();

                        if (amtDr > 0 || lineType === 'DR') drLines.push({ account: acct, amount: amtDr || parseFloat(it.amount || 0) });
                        if (amtCr > 0 || lineType === 'CR') crLines.push({ account: acct, amount: amtCr || parseFloat(it.amount || 0) });
                    });

                    drLines.forEach(d => { if (isLedgerMatch(d.account)) { dr += d.amount; displayEntityName = crLines[0]?.account || "Journal Credit Entry"; } });
                    crLines.forEach(c => { if (isLedgerMatch(c.account)) { cr += c.amount; displayEntityName = drLines[0]?.account || "Journal Debit Entry"; } });

                    if (dr > 0 || cr > 0) return { dr, cr, displayEntityName, h, rawFormId };
                }

                let itemSubtotal = 0;
                let taxTotal = parseFloat(h.taxTotal || 0) || 0;
                if (items.length > 0) {
                    items.forEach(i => {
                        const qty = parseFloat(i.qty) || 1;
                        const rate = parseFloat(i.rate) || parseFloat(i.amount) || 0;
                        itemSubtotal += (qty * rate);
                        const taxPrc = parseFloat(i.auto_item_name_ItemTax) || parseFloat(i.taxRate) || 0;
                        if (!h.taxTotal) taxTotal += (qty * rate) * (taxPrc / 100);
                    });
                }

                const grandTotal = parseFloat(h.grandTotal) || parseFloat(h.amount) || parseFloat(h.total) ||
                                  parseFloat(h.dr_amount) || parseFloat(h.cr_amount) || (itemSubtotal + taxTotal) || 0;

                const getValidName = (...names) => {
                    for (let n of names) {
                        if (n && typeof n === 'string' && n.trim() !== '' && n.trim().toLowerCase() !== 'undefined') return n.trim();
                    }
                    return "";
                };

                const partyField = getValidName(h.customer_ledger, h.supplier_ledger, h.entity, h.party_account, h.gl_account) || "Party Ledger";
                const bankField = getValidName(h.bank_account, h.debitLedger, h.creditLedger, h.gl_account) || "Bank / Cash Account";

                if (formLower.includes('sale') && !formLower.includes('return') && !formLower.includes('creditnote')) {
                    if (isLedgerMatch(partyField)) { dr = grandTotal; displayEntityName = "Sales Account"; }
                    else if (isLedgerMatch("Sales Account") || isSalesAccountSearch) { cr = grandTotal - taxTotal; displayEntityName = partyField; }
                    else if (isTaxAccountSearch && taxTotal > 0) { cr = taxTotal; displayEntityName = partyField; }
                } else if (formLower.includes('purchase') && !formLower.includes('return') && !formLower.includes('debitnote')) {
                    if (isLedgerMatch(partyField)) { cr = grandTotal; displayEntityName = "Purchase Account"; }
                    else if (isLedgerMatch("Purchase Account") || isPurchAccountSearch) { dr = grandTotal - taxTotal; displayEntityName = partyField; }
                    else if (isTaxAccountSearch && taxTotal > 0) { dr = taxTotal; displayEntityName = partyField; }
                } else if (formLower.includes('salesreturn') || formLower.includes('creditnote')) {
                    if (isLedgerMatch(partyField)) { cr = grandTotal; displayEntityName = "Sales Return Account"; }
                    else if (isLedgerMatch("Sales Return Account") || isSalesAccountSearch) { dr = grandTotal; displayEntityName = partyField; }
                } else if (formLower.includes('purchasereturn') || formLower.includes('debitnote')) {
                    if (isLedgerMatch(partyField)) { dr = grandTotal; displayEntityName = "Purchase Return Account"; }
                    else if (isLedgerMatch("Purchase Return Account") || isPurchAccountSearch) { cr = grandTotal; displayEntityName = partyField; }
                } else if (formLower.includes('receipt') && !formLower.includes('pay')) {
                    if (isLedgerMatch(bankField)) { dr = grandTotal; displayEntityName = partyField; }
                    else if (isLedgerMatch(partyField)) { cr = grandTotal; displayEntityName = bankField; }
                } else if (formLower.includes('payment')) {
                    if (isLedgerMatch(bankField)) { cr = grandTotal; displayEntityName = partyField; }
                    else if (isLedgerMatch(partyField)) { dr = grandTotal; displayEntityName = bankField; }
                } else if (formLower.includes('receiptpay')) {
                    const docType = (h.documentType || '').toUpperCase();
                    if (docType === 'RECEIPT') {
                        if (isLedgerMatch(bankField)) { dr = grandTotal; displayEntityName = partyField; }
                        else if (isLedgerMatch(partyField)) { cr = grandTotal; displayEntityName = bankField; }
                    } else {
                        if (isLedgerMatch(bankField)) { cr = grandTotal; displayEntityName = partyField; }
                        else if (isLedgerMatch(partyField)) { dr = grandTotal; displayEntityName = bankField; }
                    }
                } else {
                    if (isLedgerMatch(h.debitLedger)) { dr = grandTotal; displayEntityName = h.creditLedger || "Offsetting Entry"; }
                    else if (isLedgerMatch(h.creditLedger)) { cr = grandTotal; displayEntityName = h.debitLedger || "Offsetting Entry"; }
                    else if (isLedgerMatch(partyField)) { dr = grandTotal; displayEntityName = "General Ledger Entry"; }
                }

                return { dr, cr, displayEntityName: displayEntityName || "Offsetting Account", h, rawFormId };
            };

            // --- 5. PROCESS TRANSACTIONS WITH OPENING BALANCE & DATE RANGE ---
            const isGranular = document.getElementById('glGranularToggle')?.checked || false;
            const targetComp = (document.getElementById('targetCompany')?.value || '').trim().toLowerCase();
            const sDocNo = (document.getElementById('glSearchDocNo')?.value || '').trim().toLowerCase();
            const sDocNoFrom = (document.getElementById('glSearchDocNoFrom')?.value || '').trim().toUpperCase();
            const sDocNoTo = (document.getElementById('glSearchDocNoTo')?.value || '').trim().toUpperCase();
            const sDocDateFrom = (document.getElementById('glSearchDocDateFrom')?.value || '').trim();
            const sDocDateTo = (document.getElementById('glSearchDocDateTo')?.value || '').trim();
            const sEntity = (document.getElementById('glSearchEntity')?.value || '').trim().toLowerCase();
            const sProject = (document.getElementById('glSearchProject')?.value || '').trim().toLowerCase();
            const sDocType = (document.getElementById('glSearchDocType')?.value || '').trim().toUpperCase();
            const sNarration = (document.getElementById('glSearchNarration')?.value || '').trim().toLowerCase();
            const sMinAmt = parseFloat(document.getElementById('glSearchMinAmount')?.value) || null;
            const sMaxAmt = parseFloat(document.getElementById('glSearchMaxAmount')?.value) || null;
            const sDrCr = (document.getElementById('glSearchDrCr')?.value || '').trim().toUpperCase();

            let signedOpening = (openingBalanceType === 'Cr' ? -1 : 1) * (Number(openingBalance) || 0);
            let runningBalance = signedOpening;
            let periodTransactions = [];
            let totalMatchedOutOfRange = 0;

            allTransactions.forEach(vch => {
                const h = vch.header || vch || {};
                const vchPostingDate = h.posting_date || vch.posting_date || h.date || vch.date || h.voucher_date || vch.voucher_date || (h.posted_at ? new Date(h.posted_at).toISOString().split('T')[0] : '') || new Date().toISOString().split('T')[0];
                const vchDocDate = h.voucher_date || h.date || vchPostingDate;

                if (targetComp) {
                    const vchComp = String(h.CompanyCode || h.companyName || '').toLowerCase();
                    if (vchComp && !vchComp.includes(targetComp)) return;
                }

                const impact = processTransactionImpact(vch);
                if (impact.dr === 0 && impact.cr === 0) return;

                if (isGranular) {
                    const docNo = String(h.doc_no || h.supplier_bill_no || h.Invoice || h.paymentRef || '').toUpperCase();
                    if (sDocNoFrom && docNo < sDocNoFrom) return;
                    if (sDocNoTo && docNo > sDocNoTo) return;
                    if (sDocNo && !docNo.toLowerCase().includes(sDocNo)) return;

                    if (sDocDateFrom && vchDocDate < sDocDateFrom) return;
                    if (sDocDateTo && vchDocDate > sDocDateTo) return;

                    const ent = String(impact.displayEntityName || h.entity || '').toLowerCase();
                    if (sEntity && !ent.includes(sEntity)) return;

                    const proj = String(h.project || '').toLowerCase();
                    if (sProject && !proj.includes(sProject)) return;

                    if (sDocType) {
                        const docType = String(h.documentType || vch.documentType || impact.rawFormId || '').toUpperCase();
                        if (!docType.includes(sDocType)) return;
                    }

                    const narr = String(h.narration || '').toLowerCase();
                    if (sNarration && !narr.includes(sNarration)) return;

                    const txnAmt = impact.dr > 0 ? impact.dr : impact.cr;
                    if (sMinAmt !== null && txnAmt < sMinAmt) return;
                    if (sMaxAmt !== null && txnAmt > sMaxAmt) return;

                    if (sDrCr === 'DR' && impact.dr === 0) return;
                    if (sDrCr === 'CR' && impact.cr === 0) return;
                }

                if (fromDate && vchPostingDate < fromDate) {
                    totalMatchedOutOfRange++;
                    runningBalance += (impact.dr - impact.cr);
                } else if (toDate && vchPostingDate > toDate) {
                    totalMatchedOutOfRange++;
                } else {
                    periodTransactions.push({ vch, impact, postingDate: vchPostingDate, docDate: vchDocDate });
                }
            });

            // --- 6. BUILD LINE ITEMS WITH RUNNING BALANCE & OPEN THE LIST VIEWER ---
            const columns = getSelectedCols();
            saveCols(columns);

            let rb = runningBalance; // opening + entries before 'fromDate'
            const listRows = periodTransactions.map(({ vch, impact, postingDate, docDate }) => {
                const h = (impact && impact.h) || {};
                const entityName = resolveLedgerName(impact && impact.displayEntityName);
                rb += (Number(impact.dr) || 0) - (Number(impact.cr) || 0);
                const docType = getDocPrefix(impact && impact.rawFormId);
                const refNo = h.doc_no || h.supplier_bill_no || h.invoice_no || h.Invoice || h.paymentRef || h.voucher_no || h.refNo || '';
                return {
                    key: (vch && vch.key) || '',          // internal id — never displayed; dblclick routing only
                    formId: (vch && vch.formId) || '',    // internal type — never displayed; print/edit route only
                    postingDate: postingDate ? Utils.FormatDate(postingDate) : '',
                    docDate: docDate ? Utils.FormatDate(docDate) : '',
                    docType,
                    entity: entityName,
                    refNo,
                    narration: h.narration || '',
                    dr: Number((impact && impact.dr) || 0),
                    cr: Number((impact && impact.cr) || 0),
                    balance: rb
                };
            });

            if (listRows.length === 0 && !(Math.abs(signedOpening) > 0)) {
                if (typeof App !== 'undefined' && App.UI && App.UI.Notify) {
                    if (totalMatchedOutOfRange > 0) {
                        App.UI.Notify('Outside Period', `${totalMatchedOutOfRange} transaction(s) fall outside the selected date filter. Adjust the date range and re-execute.`, 'warning');
                    } else {
                        App.UI.Notify('No Records', `No matching transactions found for ${resolvedLedgerName}.`, 'warning');
                    }
                }
                return;
            }

            const accountMeta = {
                name: String(resolvedLedgerName || 'LEDGER ACCOUNT').toUpperCase(),
                code: resolvedLedgerCode || 'N/A',
                fromDate: fromDate || '',
                toDate: toDate || '',
                openingBalance: Math.abs(Number(openingBalance) || 0),
                openingType: openingBalanceType || 'Dr'
            };
            const engineTxns = listRows.map(r => ({
                date: r.postingDate,
                valueDate: r.docDate || r.postingDate,
                type: r.docType,
                formId: r.formId,
                doc_no: r.refNo || '---',
                particulars: r.entity,
                narration: r.narration,
                entity: r.entity,
                debit: r.dr,
                credit: r.cr
            }));
            window._glLastMeta = { account: accountMeta, transactions: engineTxns, listRows, columns };

            if (typeof App !== 'undefined' && App.UI && App.UI.Notify) {
                App.UI.Notify('Statement Ready', `${listRows.length} line item(s) compiled — opening UniTax List Viewer…`, 'success');
            }
            if (window.UniTaxList && typeof window.UniTaxList.OpenWindow === 'function') {
                window.UniTaxList.OpenWindow(listRows, {
                    title: `Ledger Statement — ${resolvedLedgerName}`,
                    meta: { account: accountMeta, columns }
                });
            }
        } catch (err) {
            console.error('generateStatement error:', err);
            if (typeof App !== 'undefined' && App.UI && App.UI.Notify) {
                App.UI.Notify('Execution Failed', (err && err.message) || 'Unable to compile the ledger statement.', 'danger');
            }
        } finally {
            setBusy(false);
        }
    };
})();
</script>
